# ============================================================================
# frontend/nginx.conf — TICKET-I126 + TICKET-I128
# ============================================================================
# WHAT:    Nginx server block for the production React UI.
# HOW:     SPA fallback + reverse proxy for the API.
# WHY:     One origin (no CORS), one image, easy to deploy. The same image
#          works in dev and on the demo laptop because the backend address is
#          resolved at RUNTIME by Docker DNS — not baked in at build time via
#          VITE_API_BASE_URL.
# OBSERVE: GET /trades returns index.html (so React Router takes over).
#          GET /api/v1/trades is proxied to the backend container.
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip shaves first-paint time off the CSS/JS bundles.
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # ---- SPA fallback ------------------------------------------------------
    # Without try_files, refreshing /trades hits nginx's 404 because there is
    # no /trades file on disk — routing lives in the React bundle.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Reverse-proxy API to the backend container ------------------------
    # TICKET-I128: `backend` is the compose service name, resolved by Docker
    # DNS on the shared network. 8080 is the CONTAINER port, not a host port.
    #
    # 127.0.0.11 is Docker's embedded DNS server, and the upstream is held in a
    # VARIABLE on purpose. With a literal `proxy_pass http://backend:8080;`
    # nginx resolves the name once at STARTUP and exits with
    # "host not found in upstream" if the backend isn't running yet — the image
    # then can't boot standalone, and a backend recreate can crash the proxy.
    # A variable defers the lookup to request time. Because proxy_pass then
    # carries no literal path, $request_uri has to be appended explicitly to
    # preserve the original path + query string.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same for /actuator/ so health probes and metrics are reachable via nginx.
    location /actuator/ {
        set $actuator_upstream http://backend:8080;
        proxy_pass $actuator_upstream$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
