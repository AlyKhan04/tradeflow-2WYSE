# ============================================================================
# docker-compose.yml — TradeFlow full-stack runtime
# ============================================================================
# This file is the SKELETON. By Day 10 you will fill in every service so that
# `docker compose up` brings up the whole platform end-to-end.
#
# TODO(TICKET-I127): wire all 7 services below + verify trade flow E2E.
# TODO(TICKET-I128): set up the docker network so services can resolve each
#                    other by name (e.g. backend can reach 'postgres', not
#                    'localhost').
#
# WHAT:    7 services: postgres, kafka, zookeeper, backend, frontend,
#          prometheus, grafana (+ kafdrop as an optional UI for Kafka).
# HOW:     Use service NAMES as DNS hostnames inside the compose network.
#          Mount the prometheus.yml from ./monitoring/prometheus/.
# WHY:     A single command must bring up the whole platform reproducibly
#          for the Day 10 final demo and for the CI/CD pipeline.
# OBSERVE: After `docker compose up -d` all 7 containers must reach the
#          'healthy' or 'running' state. The recon flow must work end-to-end.
# ============================================================================

version: "3.9"

services:
  # --------------------------------------------------------------------------
  # PostgreSQL — primary store for trades, counterparties, recon results
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: tradeflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradeflow}
      POSTGRES_USER: ${POSTGRES_USER:-tradeflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeflow_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # Kafka + Zookeeper (Day 9)
  # --------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tradeflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tradeflow-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: tradeflow-kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"

  # --------------------------------------------------------------------------
  # Backend — Spring Boot recon-service
  # --------------------------------------------------------------------------
  # TODO(TICKET-I125 + TICKET-I127): build from ./backend/Dockerfile, depend on
  # postgres + kafka, expose 8080, point JDBC URL to 'postgres' (NOT localhost).
  #
  # backend:
  #   build: ./backend
  #   ...

  # --------------------------------------------------------------------------
  # Frontend — React UI behind nginx
  # --------------------------------------------------------------------------
  # TODO(TICKET-I126 + TICKET-I127): build from ./frontend/Dockerfile, expose 80
  # (mapped to host 5173), depend on backend.
  #
  # frontend:
  #   build: ./frontend
  #   ...

  # --------------------------------------------------------------------------
  # Prometheus — scrapes /actuator/prometheus from backend
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tradeflow-prometheus
    depends_on:
      - kafka
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  # --------------------------------------------------------------------------
  # Grafana — dashboards for API + Kafka metrics
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: tradeflow-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  postgres-data:
  grafana-data:
