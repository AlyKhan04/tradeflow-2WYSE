spring:
  datasource:
    url: jdbc:h2:mem:tradeflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: embedded

logging:
  level:
    com.dbtraining.tradeflow: DEBUG
    org.hibernate.SQL: DEBUG